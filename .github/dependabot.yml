version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [CodeEx24]
    reviewers: [CodeEx24]
    labels: [dependencies]
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: [CodeEx24]
    reviewers: [CodeEx24]
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
